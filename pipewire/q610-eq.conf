# JBL Quantum 610 factory tuning — PipeWire filter chain
# Generated IR: run  python3 tools/generate_q610_eq.py
# then set filename below to the generated q610_factory_eq_48k.wav path.
# Install (user scope): copy this file to
#   ~/.config/pipewire/filter-chain.conf.d/q610-eq.conf
# and: systemctl --user restart pipewire
# Pattern borrowed from Pakrohk/linux-hifi-suite (configs/eq.conf).

context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "JBL Quantum 610 Factory EQ"
            media.name       = "JBL Quantum 610 Factory EQ"
            filter.graph = {
                nodes = [
                    { type = builtin
                      label = convolver
                      name  = convolver
                      config = { filename = "/home/tymon/.local/share/jbl-quantum-linux/q610_factory_eq_48k.wav" }
                    }
                ]
                inputs  = [ "convolver:In" ]
                outputs = [ "convolver:Out" ]
            }
            audio.channels = 2
            capture.props = {
                node.name   = "input.effect_q610eq"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name   = "output.effect_q610eq"
                node.passive = true
            }
        }
    }
]
